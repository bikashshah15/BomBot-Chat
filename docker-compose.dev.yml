services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bombot
      POSTGRES_USER: bombot
      POSTGRES_PASSWORD: bombot_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bombot_postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bombot -d bombot"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  bombot_postgres_data:
